<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SICOFO - Consulta General</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.2/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="img/logo-sicofo.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="visor-secretaria">
  <!-- Contenedor de toasts -->
  <div id="toast-container" class="toast-container"></div>

  <nav class="navbar-asiste">
    <img class="navbar-logo" src="img/logo-sicofo.png" alt="SICOFO">
    <a class="navbar-brand" href="dashboard-visor-general.html">
      <span>
        <span class="brand-title d-block">SPyAP</span>
        <span class="brand-subtitle">Visor</span>
      </span>
    </a>
    <div class="user-info">
      <div class="navbar-user">
        <div class="navbar-avatar-iniciales" id="avatar-iniciales"></div>
        <div class="navbar-user-info">
          <span class="navbar-user-nombre" id="nombre-usuario"></span>
          <span class="navbar-user-area" id="area-usuario"></span>
          <span class="rol-badge" id="rol-badge"></span>
        </div>
      </div>
      <button class="btn-logout" onclick="cerrarSesion()"><i class="bi bi-box-arrow-right me-1" aria-hidden="true"></i>Cerrar sesión</button>
    </div>
  </nav>

  <div class="container-admin pt-4 pb-4">
    <h1 class="page-title">Consulta General de Oficios</h1>

    <nav class="visor-secciones-nav" aria-label="Secciones de consulta">
      <ul class="visor-recuadros" id="visorSecciones" role="tablist">
        <li role="presentation">
          <button class="visor-recuadro active" id="tab-actividad" data-bs-toggle="tab" data-bs-target="#seccion-actividad" type="button" role="tab" aria-controls="seccion-actividad" aria-selected="true">
            <span class="visor-recuadro__icono" aria-hidden="true"><i class="bi bi-search"></i></span>
            <span class="visor-recuadro__texto"><strong>Consultar oficios</strong><small>Busque y filtre todos los oficios registrados</small></span>
          </button>
        </li>
      </ul>
    </nav>

    <div class="visor-anios" id="visorAnios" role="group" aria-label="Consultar oficios por año"></div>

    <div class="tab-content visor-secciones-contenido">
      <div class="tab-pane fade show active" id="seccion-actividad" role="tabpanel" aria-labelledby="tab-actividad" tabindex="0">
    <section class="card-asiste actividad-reciente-card" aria-labelledby="actividad-reciente-titulo">
      <div class="card-header-asiste">
        <div>
          <h3 class="card-title-asiste" id="actividad-reciente-titulo">Consultar oficios</h3>
          <p class="actividad-reciente-subtitulo">Oficios cuya fecha de documento corresponde al año seleccionado, del más reciente al más antiguo.</p>
        </div>
        <span class="badge text-primario">Total: <span id="total-mostrados">0</span></span>
      </div>
      <div class="busqueda-documentos busqueda-documentos--integrada">
        <label class="form-label" for="busqueda-documento">Buscar documentos</label>
        <div class="busqueda-documentos__campo">
          <i class="bi bi-search" aria-hidden="true"></i>
          <input type="search" class="form-control" id="busqueda-documento" placeholder="Busque por folio, asunto, origen, destinatario o solicitante (ej. SPyAP/012)">
        </div>
      </div>
      <div class="actividad-filtros" aria-label="Búsqueda y filtros de oficios">
        <div>
          <label class="form-label" for="filtro-tipo">Tipo de documento</label>
          <select class="form-select" id="filtro-tipo">
            <option value="">Todos los tipos</option>
            <option value="oficio">Oficio</option>
            <option value="memorandum">Memorandum</option>
            <option value="circular">Circular</option>
            <option value="incidencias">Incidencias</option>
            <option value="memorandum_comision">Memorandum de Comisión</option>
          </select>
        </div>
        <div>
          <label class="form-label" for="filtro-area">Área del documento</label>
          <input type="text" class="form-control" id="filtro-area" placeholder="Nombre o sigla, ej. DG">
        </div>
        <div>
          <label class="form-label" for="filtro-estatus">Estatus del documento</label>
          <select class="form-select" id="filtro-estatus">
            <option value="">Todos los estatus</option>
            <option value="Pendiente">Pendiente</option>
            <option value="Asignado">Asignado</option>
            <option value="Cancelado">Cancelado</option>
            <option value="Rechazado">Rechazado</option>
          </select>
        </div>
      </div>
      <div class="actividad-reciente-lista" id="lista-actividad" aria-live="polite"></div>
      <nav class="actividad-paginacion" id="paginacion-actividad" aria-label="Paginación de oficios"></nav>
    </section>
      </div>
    </div>
  </div>

  <!-- Modal de detalle del folio -->
  <div class="modal fade modal--detalle" id="modalDetalleFolio" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header modal-header-asiste">
          <h5 class="modal-title" id="detalle-titulo">Detalle del folio</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div id="detalle-contenido"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-asiste-secondary" data-bs-dismiss="modal">Cerrar</button>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer-asiste">
    Secretaría de Pesca y Acuacultura del Pueblo · Gobierno de Chiapas 2024 – 2030 · SICOFO
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const session = sesionVigente({ permiso: 'consultar_oficios', mensaje: 'No tiene permiso para ver oficios' });
      if (!session) return;
      pintarUsuario(session);
      cargarOficios();
      renderSelectorAnios();
      limitarFilasVisibles(document.getElementById('lista-actividad'), '.actividad-reciente-item', 5);

      document.getElementById('filtro-tipo').addEventListener('change', aplicarFiltros);
      document.getElementById('filtro-area').addEventListener('input', aplicarFiltros);
      document.getElementById('filtro-estatus').addEventListener('change', aplicarFiltros);
      document.getElementById('busqueda-documento').addEventListener('input', aplicarFiltros);
    });

    const REGISTROS_POR_PAGINA = 25;
    let paginaActividadActual = 1;
    // Año seleccionado (centro del selector). Por defecto, el año en curso.
    let anioSeleccionado = new Date().getFullYear();

    function anioDeRegistro(f) {
      return anioDeFolio(f);
    }

    function renderSelectorAnios() {
      const cont = document.getElementById('visorAnios');
      const anios = [anioSeleccionado - 1, anioSeleccionado, anioSeleccionado + 1];
      cont.innerHTML = anios.map((anio, i) => `
        <button type="button" class="visor-anio ${i === 1 ? 'visor-anio--centro active' : 'visor-anio--lado'}" data-anio="${anio}" aria-pressed="${i === 1}" aria-label="Oficios del año ${anio}">
          <span class="visor-anio__numero">${anio}</span>
          <small>${i === 1 ? 'Año seleccionado' : 'Ver oficios'}</small>
        </button>`).join('');
      cont.querySelectorAll('.visor-anio--lado').forEach(btn => {
        btn.addEventListener('click', () => seleccionarAnio(Number(btn.dataset.anio)));
      });
    }

    function seleccionarAnio(anio) {
      anioSeleccionado = anio;
      paginaActividadActual = 1;
      renderSelectorAnios();
      cargarOficios();
    }

    function cargarOficios() {
      const oficios = getOficios();
      const lista = document.getElementById('lista-actividad');
      const paginacion = document.getElementById('paginacion-actividad');
      const totalSpan = document.getElementById('total-mostrados');
      const tipo = NOMBRES_OFICIO;
      const tipos = TODAS_LAS_TABLAS;
      let filas = [];

      tipos.forEach(tabla => {
        (oficios[tabla] || []).forEach(f => {
          filas.push({ tabla, f });
        });
      });

      const busqueda = (document.getElementById('busqueda-documento').value || '').trim().toLowerCase();
      const tipoFiltro = document.getElementById('filtro-tipo').value;
      const areaFiltro = (document.getElementById('filtro-area').value || '').trim().toLowerCase();
      const estatusFiltro = document.getElementById('filtro-estatus').value;

      filas = filas.filter(({ f }) => anioDeRegistro(f) === anioSeleccionado);
      filas = filas.filter(({ tabla }) => !tipoFiltro || tabla === TIPOS_OFICIO[tipoFiltro]);
      if (busqueda) {
        filas = filas.filter(({ f, tabla }) => [f.folio, f.asunto, valorOrigen(f, tabla), f.dirigido_a, f.nombre_solicitante]
          .some(valor => String(valor || '').toLowerCase().includes(busqueda)));
      }
      if (areaFiltro) {
        filas = filas.filter(({ f }) => {
          const siglaArea = getSiglaByAreaId(f.id_area) || (f.folio || '').split('/')[0] || '';
          const nombreArea = getAreaNameById(f.id_area) || '';
          return siglaArea.toLowerCase().includes(areaFiltro) || nombreArea.toLowerCase().includes(areaFiltro);
        });
      }
      if (estatusFiltro) filas = filas.filter(({ f }) => f.estatus === estatusFiltro);

      // Del más reciente al más antiguo según la fecha del documento (la fecha con la que sale);
      // a igual fecha, por fecha de solicitud y luego por folio.
      filas.sort(({ f: a }, { f: b }) => {
        const clave = (f, campo) => aFechaLocal(f[campo]);
        return clave(b, 'fecha_documento').localeCompare(clave(a, 'fecha_documento'))
          || clave(b, 'fecha_solicitud').localeCompare(clave(a, 'fecha_solicitud'))
          || String(b.folio || '').localeCompare(String(a.folio || ''), undefined, { numeric: true });
      });

      const totalPaginas = Math.max(1, Math.ceil(filas.length / REGISTROS_POR_PAGINA));
      paginaActividadActual = Math.min(paginaActividadActual, totalPaginas);
      const inicio = (paginaActividadActual - 1) * REGISTROS_POR_PAGINA;
      const registrosPagina = filas.slice(inicio, inicio + REGISTROS_POR_PAGINA);

      lista.innerHTML = '';
      registrosPagina.forEach(({ tabla, f }) => {
        const fechaSolicitud = f.fecha_solicitud ? presentarFecha(f.fecha_solicitud) : 'N/A';
        const fechaDocumento = f.fecha_documento ? presentarFecha(f.fecha_documento) : 'N/A';
        const articulo = document.createElement('article');
        articulo.className = 'actividad-reciente-item';
        articulo.innerHTML = `
          <div class="actividad-reciente-marca" aria-hidden="true"><i class="bi bi-file-earmark-text"></i></div>
          <div class="actividad-reciente-contenido">
            <div class="actividad-reciente-encabezado">
              <div>
                <strong class="actividad-reciente-folio">${escapeHtml(f.folio || '—')}</strong>
                <span class="actividad-reciente-tipo">${escapeHtml(tipo[tabla] || tabla)}</span>
              </div>
              ${badgeEstatus(f.estatus)}
            </div>
            <p class="actividad-reciente-asunto">${escapeHtml(f.asunto || 'Sin asunto')}</p>
          </div>
          <div class="actividad-reciente-meta">
            <div class="actividad-reciente-dato"><i class="bi bi-building" aria-hidden="true"></i><span><small>Área</small><strong>${escapeHtml(getAreaNameById(f.id_area) || 'Área no especificada')}</strong></span></div>
            ${tipoUsaCargoOrigen(tipoDeRegistro(f, tabla)) ? `<div class="actividad-reciente-dato"><i class="bi bi-send" aria-hidden="true"></i><span><small>${escapeHtml(etiquetaOrigen())}</small><strong>${escapeHtml(valorOrigen(f, tabla) || 'No especificado')}</strong></span></div>` : ''}
            <div class="actividad-reciente-dato"><i class="bi bi-person" aria-hidden="true"></i><span><small>Solicitante</small><strong>${escapeHtml(f.id_usuario_solicitante ? (f.nombre_solicitante || 'Usuario ' + String(f.id_usuario_solicitante).substring(0, 8)) : 'Sin solicitante')}</strong></span></div>
            <div class="actividad-reciente-dato"><i class="bi bi-calendar3" aria-hidden="true"></i><time datetime="${escapeHtml(aFechaLocal(f.fecha_solicitud))}"><small>Fecha de solicitud</small><strong>${fechaSolicitud}</strong></time></div>
            <div class="actividad-reciente-dato"><i class="bi bi-calendar-check" aria-hidden="true"></i><time datetime="${escapeHtml(aFechaLocal(f.fecha_documento))}"><small>Fecha del documento</small><strong>${fechaDocumento}</strong></time></div>
          </div>
          ${f.folio ? `<button type="button" class="btn btn-asiste-secondary btn-sm actividad-reciente-ver" onclick="verDetalle('${escapeJs(tabla)}', '${escapeJs(String(f.folio))}')">Ver detalle<i class="bi bi-arrow-right" aria-hidden="true"></i></button>` : ''}
        `;
        lista.appendChild(articulo);
      });

      if (filas.length === 0) {
        lista.innerHTML = `<div class="actividad-reciente-vacia"><i class="bi bi-inbox" aria-hidden="true"></i><strong>No hay oficios que coincidan con los filtros en ${anioSeleccionado}</strong><span>Pruebe cambiando el año o limpiando los criterios de búsqueda.</span></div>`;
      }
      totalSpan.textContent = filas.length;
      renderPaginacionActividad(filas.length, totalPaginas);
    }

    function verDetalle(tabla, folio) {
      mostrarDetalleFolioModal(tabla, folio, 'detalle-titulo', 'detalle-contenido', 'modalDetalleFolio');
    }

    function aplicarFiltros() {
      paginaActividadActual = 1;
      cargarOficios();
    }

    function renderPaginacionActividad(total, totalPaginas) {
      const paginacion = document.getElementById('paginacion-actividad');
      if (total <= REGISTROS_POR_PAGINA) {
        paginacion.innerHTML = total ? `<span>Mostrando ${total} registro${total === 1 ? '' : 's'}</span>` : '';
        return;
      }
      const inicio = (paginaActividadActual - 1) * REGISTROS_POR_PAGINA + 1;
      const fin = Math.min(paginaActividadActual * REGISTROS_POR_PAGINA, total);
      paginacion.innerHTML = `
        <span>Mostrando ${inicio}–${fin} de ${total}</span>
        <div>
          <button type="button" class="btn btn-asiste-secondary btn-sm" onclick="cambiarPaginaActividad(-1)" ${paginaActividadActual === 1 ? 'disabled' : ''}><i class="bi bi-chevron-left" aria-hidden="true"></i><span class="visually-hidden">Página anterior</span></button>
          <span class="actividad-paginacion__pagina">Página ${paginaActividadActual} de ${totalPaginas}</span>
          <button type="button" class="btn btn-asiste-secondary btn-sm" onclick="cambiarPaginaActividad(1)" ${paginaActividadActual === totalPaginas ? 'disabled' : ''}><i class="bi bi-chevron-right" aria-hidden="true"></i><span class="visually-hidden">Página siguiente</span></button>
        </div>
      `;
    }

    function cambiarPaginaActividad(delta) {
      paginaActividadActual += delta;
      cargarOficios();
      document.getElementById('actividad-reciente-titulo').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

  </script>
</body>
</html>
